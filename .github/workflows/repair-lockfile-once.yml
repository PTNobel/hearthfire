name: Repair dependency lockfile once (temporary)

on:
  push:
    branches: [dependency-upgrades-2026-10]

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dependency-upgrades-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Recompute lockfile with npm
        run: |
          npm install --package-lock-only --no-fund
          npm ci --no-fund
          npm ls @grpc/grpc-js
      - name: Commit verified lockfile and delete temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-lockfile-once.yml
          git add package-lock.json package.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Regenerate npm lockfile for patched gRPC override"
          git push origin HEAD:dependency-upgrades-2026-10
