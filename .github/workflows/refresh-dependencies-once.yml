name: Refresh dependencies once (temporary)

on:
  push:
    branches: [dependency-upgrades-2026-10]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dependency-upgrades-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Update compatible direct and transitive dependencies
        run: |
          npm update --save --package-lock-only --no-fund
          # Do not force semver-major changes automatically.
          npm audit fix --package-lock-only --no-fund || echo 'Some advisories may require manual major upgrades.'
      - name: Report remaining outdated dependencies and advisories
        run: |
          npm outdated --depth=0 || true
          npm audit --json > /tmp/hearthfire-npm-audit.json || true
          node -e "const x=require('/tmp/hearthfire-npm-audit.json'); console.log('Remaining audit counts:', JSON.stringify(x.metadata?.vulnerabilities || {})); console.log('Affected packages:', Object.entries(x.vulnerabilities || {}).map(([k,v])=>k+':'+v.severity).join(', '));"
      - name: Commit lockfile update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-dependencies-once.yml
          git add package.json package-lock.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Refresh compatible npm dependencies and security fixes"
          git push origin HEAD:dependency-upgrades-2026-10
